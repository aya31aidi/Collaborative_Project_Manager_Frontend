stages:
  - install

# Etape d'installation des dépendances
install_dependencies:
  stage: install
  image: node:18  # Choisir l'image Docker contenant Node.js
  script:
    - npm install --legacy-peer-deps
  only:
    - main  # Exécute le pipeline uniquement sur la branche principale (ou adaptez selon votre branche)

stages:
  - install
  - test
  - build
  - deploy

# Étape d'installation des dépendances
install_dependencies:
  stage: install
  image: node:18
  script:
    - npm install --legacy-peer-deps
  cache:
    paths:
      - node_modules/

# Étape des tests unitaires
test:
  stage: test
  image: node:18
  script:
    - npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox
  artifacts:
    paths:
      - coverage/

# Étape de la construction du projet Angular
build:
  stage: build
  image: node:18
  script:
    - npm run build --prod
  artifacts:
    paths:
      - dist/

# Étape de déploiement (optionnelle)
deploy:
  stage: deploy
  image: node:18
  script:
    - echo "Déploiement sur votre serveur"




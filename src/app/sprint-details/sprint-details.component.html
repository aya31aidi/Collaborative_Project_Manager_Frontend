<div class="container mt-4">
    <h2>Sprint Details</h2>
    <div *ngIf="sprint">
      <h3>{{ sprint.name }}</h3>
      <p><strong>Start Date:</strong> {{ sprint.startDate }}</p>
      <p><strong>End Date:</strong> {{ sprint.endDate }}</p>
  
      <h4>Tasks</h4>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Assigned To</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let task of sprint.tasks">
            <td>{{ task.id }}</td>
            <td>{{ task.title }}</td>
            <td>{{ task.description }}</td>
            <td>{{ task.status }}</td>
            <td>{{ task.priority }}</td>
            <td>{{ task.assignedTo.fullName }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

<div class="container" *ngIf="sprintData">
  <h2>{{ sprintData.name }}</h2>
  <p><strong>Start Date:</strong> {{ sprintData.startDate }}</p>
  <p><strong>End Date:</strong> {{ sprintData.endDate }}</p>
  <button class="add-task-btn" data-bs-toggle="modal" data-bs-target="#addTaskModal">
    <i class="fas fa-plus"></i> Add Task
  </button>
  
  <div class="kanban-container">
    <div
      class="kanban-column"
      *ngFor="let column of kanbanColumns"
      cdkDropList
      [cdkDropListData]="getTasksForColumn(column.keyField)"
      (cdkDropListDropped)="onTaskDropped($event)"
      [id]="column.keyField"
      [cdkDropListConnectedTo]="connectedColumns"
    >
      <h3>{{ column.headerText }}</h3>
      <div
        class="kanban-task"
        *ngFor="let task of getTasksForColumn(column.keyField)"
        cdkDrag
        [cdkDragData]="task"
      >
        <h4>{{ task.title }}</h4>
        <p>{{ task.description }}</p>
        <p>
          <strong>Priority:</strong>
          <button class="priority-btn"
            [ngClass]="{
              'priority-low': task.priority === 'LOW', 
              'priority-medium': task.priority === 'MEDIUM', 
              'priority-high': task.priority === 'HIGH'
            }">
            {{ task.priority || 'No Priority' }}
          </button>
        </p>
        <p><strong>Assigned To:</strong> {{ task.assignedTo.fullName }}</p>
        <p><strong>Tags:</strong> </p>
        <div class="tags-container">
          <button
            class="tag-btn"
            *ngFor="let tag of (task.tagsList || [])"
          >
            {{ tag }}
          </button>
        </div>
        <div class="task-actions">
          <!-- Icône Modifier -->
          <button class="action-btn" (click)="editTask(task)">
            <i class="fas fa-edit"></i>
          </button>
          <!-- Icône Joindre un Fichier -->
          <button class="action-btn" (click)="attachFileToTask(task)">
            <i class="fas fa-paperclip"></i>
          </button>
          <!-- Icône Supprimer -->
          <button class="action-btn" (click)="deleteTask(task)">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
    </div>
    
  </div>
  
</div>

<!-- Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addTaskModalLabel">Add Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="addTaskForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="title" class="form-label">Task Title</label>
            <input type="text" id="title" class="form-control" formControlName="title" required />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" class="form-control" formControlName="description" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label for="priority" class="form-label">Priority</label>
            <select id="priority" class="form-select" formControlName="priority">
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
            </select>
            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select id="status" class="form-select" formControlName="status">
                <option value="TO_DO">To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="DONE">Done</option>
              </select>
            </div>
            
          </div>
          <div class="mb-3">
            <label for="assignedTo" class="form-label">Assigned To</label>
            <select id="assignedTo" class="form-select" formControlName="assignedTo">
              <option *ngFor="let user of usersList" [value]="user.id">
                {{ user.fullName }}
              </option>
            </select>
          </div>
          <div formArrayName="tags">
            <div *ngFor="let tag of tags.controls; let i = index">
              <div class="input-group mb-2">
                <input type="text" class="form-control" [formControlName]="i" placeholder="Tag" />
                <button type="button" class="btn btn-danger" (click)="removeTag(i)">Remove</button>
              </div>
            </div>
            <button type="button" class="btn btn-primary" (click)="addTag()">Add Tag</button>
          </div>
          <!-- Champ caché pour l'ID du sprint -->
           <input type="hidden" formControlName="sprintId" [value]="sprintData?.id" />
           
          <button type="submit" class="btn btn-primary">Add Task</button>
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="container mt-4">
    <h2>Add New Sprint</h2>
    <form (ngSubmit)="addSprint()" #sprintForm="ngForm">
      <div class="form-group">
        <label for="name">Sprint Name</label>
        <input
          type="text"
          id="name"
          class="form-control"
          [(ngModel)]="sprintName"
          name="name"
          required
          #name="ngModel"
        />
        <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-danger">
          Sprint name is required.
        </div>
      </div>
  
      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input
          type="date"
          id="startDate"
          class="form-control"
          [(ngModel)]="startDate"
          name="startDate"
          required
          #startDate="ngModel"
        />
        <div *ngIf="startDate.invalid && (startDate.dirty || startDate.touched)" class="text-danger">
          Start date is required.
        </div>
      </div>
  
      <div class="form-group">
        <label for="endDate">End Date</label>
        <input
          type="date"
          id="endDate"
          class="form-control"
          [(ngModel)]="endDate"
          name="endDate"
          required
          #endDate="ngModel"
        />
        <div *ngIf="endDate.invalid && (endDate.dirty || endDate.touched)" class="text-danger">
          End date is required.
        </div>
      </div>
  
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="sprintForm.invalid"
      >
        Add Sprint
      </button>
    </form>
  </div>

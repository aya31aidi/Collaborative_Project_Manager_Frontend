<div class="container">
    <h2>Tags List</h2>
  
    <button class="add-tag-button" routerLink="/add-tag">Add Tag</button>
  
    <!-- Affichage de la liste des tags -->
    <div *ngIf="tags && tags.length > 0; else noTags">
      <table class="tags-table">
        <thead>
          <tr>
            <th>Tag Name</th>
            <th>Task</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tag of tags">
            <td>{{ tag.name }}</td>
            <td>{{ tag.task?.title || 'No Task Assigned' }}</td> <!-- Affichage du titre de la tâche -->
            <td>
              <button [routerLink]="['/edit-tag', tag.id]" class="btn btn-warning">
                Edit
              </button>
              <button (click)="deleteTag(tag.id)" class="btn btn-danger">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- Message lorsque la liste est vide -->
    <ng-template #noTags>
      <p>No tags found.</p>
    </ng-template>
  </div>

<div class="container">
    <h2>Edit Tag</h2>
    <div *ngIf="isLoading">Loading tag data...</div>
  
    <form *ngIf="!isLoading" (submit)="updateTag()">
      <div class="form-group">
        <label for="tagName">Tag Name</label>
        <input
          type="text"
          id="tagName"
          class="form-control"
          [(ngModel)]="tag.name"
          name="tagName"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="taskId">Select Task</label>
        <select id="taskId" class="form-control" [(ngModel)]="tag.taskId" name="taskId">
          <option *ngFor="let task of tasks" [value]="task.id">{{ task.title }}</option>
        </select>
      </div>
  
      <button type="submit" class="btn btn-success">Save Changes</button>
      <a class="btn btn-secondary" routerLink="/tags">Cancel</a>

    </form>
  </div>

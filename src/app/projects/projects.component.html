<div class="container mt-4">
  <h2>Projects</h2>
  <button class="btn btn-primary add-btn" routerLink="/add-project">Add New Project</button>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Teams</th>
        <th>Sprints</th>
        <th>Actions</th> <!-- Nouvelle colonne pour les actions -->
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let project of projects">
        <td>{{ project.id }}</td>
        <td>{{ project.name }}</td>
        <td>{{ project.description }}</td>
        <td>{{ project.team.name }}</td>
        <td>
          <div *ngIf="project.sprints && project.sprints.length > 0; else noSprints">
            <ul>
              <li *ngFor="let sprint of project.sprints">
                <button [routerLink]="['/sprints', sprint.id]" class="btn btn-info btn-sm">{{ sprint.name }}</button>
              </li>
            </ul>
          </div>
          <ng-template #noSprints>No Sprints</ng-template>
        </td>
        <td>
          <!-- Bouton pour ajouter un sprint -->
          <button [routerLink]="['/add-sprint', project.id]" class="btn btn-success btn-sm">Add Sprint</button>
          <button (click)="editProject(project.id)" class="btn btn-warning btn-sm ml-2">Edit</button>
          <button (click)="deleteProject(project.id)" class="btn btn-danger btn-sm ml-2">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

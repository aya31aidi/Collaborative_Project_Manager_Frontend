<div class="container mt-4">
  <h2>Projects</h2>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Teams</th>
        <th>Sprints</th> <!-- Nouvelle colonne pour les Sprints -->
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let project of projects">
        <td>{{ project.id }}</td>
        <td>{{ project.name }}</td>
        <td>{{ project.description }}</td>
        <td>
          <div *ngIf="project.teams && project.teams.length > 0; else noTeams">
            <ul>
              <li *ngFor="let team of project.teams">
                <a [routerLink]="['/teams', team.id]" class="btn btn-primary btn-sm">{{ team.name }}</a>
              </li>
            </ul>
          </div>
          <ng-template #noTeams>No Teams</ng-template>
        </td>
        <td>
          <div *ngIf="project.sprints && project.sprints.length > 0; else noSprints">
            <ul>
              <li *ngFor="let sprint of project.sprints">
                <button [routerLink]="['/sprints', sprint.id]" class="btn btn-info btn-sm">{{ sprint.name }}</button>
              </li>
            </ul>
          </div>
          <ng-template #noSprints>No Sprints</ng-template>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="container">
  <h2>All Users</h2>
  <a routerLink="/add-user" class="btn btn-success mb-3">Add User</a>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th> <!-- Nouvelle colonne d'actions -->
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.fullName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button (click)="editUser(user)" class="btn btn-warning btn-sm">Edit</button>
          <button (click)="deleteUser(user.id)" class="btn btn-danger btn-sm">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="!users || users.length === 0">No users found.</p>
</div>

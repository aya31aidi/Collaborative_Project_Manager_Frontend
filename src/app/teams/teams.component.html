<div class="container">
    <h2>Teams</h2>
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let team of teams">
          <td>{{ team.id }}</td>
          <td>{{ team.name }}</td>
          <td>
            <a [routerLink]="['/teams', team.id]" class="btn btn-primary">View Details</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

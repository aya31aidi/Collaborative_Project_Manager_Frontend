<div class="container">
  <h2>Teams</h2>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Project</th> <!-- Added a column for the Project Name -->
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let team of teams">
        <td>{{ team.id }}</td>
        <td>{{ team.name }}</td>
        <td>{{ team.projectName || 'No associated project' }}</td> <!-- Display the project name -->
        <td>
          <a [routerLink]="['/teams', team.id]" class="btn btn-primary view-details">View Details</a>
          <button (click)="editTeam(team.id)" class="edit">Edit</button>
          <button (click)="deleteTeam(team.id)" class="delete">Delete</button>
        </td>
        
      </tr>
    </tbody>
  </table>
</div>

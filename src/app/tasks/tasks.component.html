<div class="container mt-4">
    <h2>Tasks List</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>#</th>
          <th>Task Name</th>
          <th>Description</th>
          <th>Due Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let task of tasks">
          <td>{{ task.id }}</td>
          <td>{{ task.title }}</td>
          <td>{{ task.description }}</td>
          <td>{{ task.priority  }}</td>
          <td>{{ task.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>

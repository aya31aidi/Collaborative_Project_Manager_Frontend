<div class="container mt-4">
  <h2>Tasks List</h2>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Task Name</th>
        <th>Description</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Actions</th> <!-- Nouvelle colonne d'actions -->
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let task of tasks">
        <td>{{ task.id }}</td>
        <td>{{ task.title }}</td>
        <td>{{ task.description }}</td>
        <td>{{ task.priority }}</td> <!-- Assurez-vous d'utiliser la bonne propriété pour la date -->
        <td>{{ task.status }}</td>
        <td>
         <!--<a [routerLink]="['/edit-task', task.id]" class="btn btn-warning btn-sm">Edit</a>--> 
          <button (click)="deleteTask(task.id)" class="delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="container">
    <h2>Edit User</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" [(ngModel)]="user.username" name="username" required />
      </div>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-control" [(ngModel)]="user.fullName" name="fullName" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required />
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" class="form-control" [(ngModel)]="user.role" name="role" required />
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <button type="button" (click)="cancel()" class="btn btn-secondary">Cancel</button>
    </form>
  </div>

<div class="container">
    <h2>Add New Tag</h2>
    <div *ngIf="isLoading">Adding tag...</div>
  
    <div *ngIf="!isLoading">
      <form (submit)="addTag()">
        <div class="form-group">
          <label for="tagName">Tag Name</label>
          <input
            type="text"
            id="tagName"
            class="form-control"
            [(ngModel)]="tagName"
            name="tagName"
            required
          />
        </div>
        <select [(ngModel)]="selectedTaskId" name="selectedTaskId" required>
            <option value="" disabled selected>Select a task</option>
            <ng-container *ngIf="tasks && tasks.length > 0; else noTasks">
              <option *ngFor="let task of tasks" [value]="task.id">{{ task.title }}</option>
            </ng-container>
          </select>
          
          <ng-template #noTasks>
            <option disabled>No tasks available</option>
          </ng-template>
          
        <button type="submit" class="btn btn-primary">Add Tag</button>
        <button type="button" class="btn btn-secondary cancel-btn" routerLink="/tags">Cancel</button>
      </form>
    </div>
  </div>

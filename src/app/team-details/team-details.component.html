<div class="container">
  <h2>Team Details</h2>
  <div *ngIf="team; else noTeam">
    <p><strong>ID:</strong> {{ team.id }}</p>
    <p><strong>Name:</strong> {{ team.name }}</p>
    <p><strong>Project:</strong> {{ team.project?.name || 'No associated project' }}</p>

    <h3>Users</h3>
    <div *ngIf="team.users && team.users.length > 0; else noUsers">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th> <!-- Ajout de la colonne pour les actions -->
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of team.users">
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.fullName }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>
              <button (click)="deleteUserFromTeam(team.id, user.id)" class="btn btn-danger">
                Delete User
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #noUsers>
      <p>No users found for this team.</p>
    </ng-template>

  </div>

  <ng-template #noTeam>
    <p>No team found.</p>
  </ng-template>
</div>

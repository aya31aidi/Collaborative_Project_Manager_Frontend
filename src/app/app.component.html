<div class="shell">
  <header class="topbar">
    <button type="button" class="icon-btn" (click)="menuOpen.set(true)" aria-label="Open menu">
      <app-icon name="menu" [size]="20" />
    </button>
    <a routerLink="/" class="brand">
      <span class="mark"><app-icon name="board" [size]="15" [stroke]="2.4" /></span>
      Project Manager
    </a>
  </header>

  @if (menuOpen()) {
    <div class="scrim" (click)="menuOpen.set(false)"></div>
  }

  <aside class="sidebar" [class.open]="menuOpen()">
    <a routerLink="/" class="brand">
      <span class="mark"><app-icon name="board" [size]="15" [stroke]="2.4" /></span>
      <span>
        Project Manager
        <small>Collaborative workspace</small>
      </span>
    </a>

    <nav aria-label="Main">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          class="nav-link"
        >
          <app-icon [name]="item.icon" [size]="17" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-foot">
      <button type="button" class="nav-link" (click)="theme.toggle()">
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="17" />
        {{ theme.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
      </button>
      <p class="credit">Spring Boot · Angular · MySQL</p>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<app-toast-host />
<app-confirm-dialog />

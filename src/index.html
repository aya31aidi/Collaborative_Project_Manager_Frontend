<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Collaborative project manager: projects, teams, sprints and a drag-and-drop task board.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Applies the saved theme before Angular starts, so the page does not flash.
    try {
      var saved = localStorage.getItem('pm.theme');
      if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset['theme'] = 'dark';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
